<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudos de iframe</title>
  <style>
    iframe {
      width: 200px;
      height: 240px;
      border: 1px dashed black;
    }
  </style>
</head>
<body>
  <h1>Testando o uso de um iframe</h1>
  <p>
    acessando o site do
     <iframe src="https://www.cursoemvideo.com" frameborder="0" height="400">
      <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
     </iframe>
     

    para aprender a programar
  
  </p>

  <p>
    O site do 
    <iframe src="https://www.google.com.br" frameborder="0" width="500" height="300">
      <a href="https://www.google.com.br" target="_blank">Google</a>
    </iframe>
    
  também é muito legal, pena que não funciona dentro do iframe!
  </p>

  
</body>
</html>
