<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesclagem de células</title>
   <style>
    table {
      width: 300px;
      border-collapse: collapse;
      text-align: center;
    }
    td {
      border: 1px solid black;
      padding: 8px;
    }
   </style>
</head>
<body>
  <h1>Mesclagem de células</h1>
  
  <table>
    <tr>
       <td rowspan="2">A</td>
       <td>B</td>
       <td>C</td>  
    </tr>
       
    <tr>
      
      <td>E</td>
      <td>F</td>
    </tr>

    <tr>
      <td>G</td>
      <td colspan="2">H</td>
      
    </tr>
  </table>
</body>
</html>
